<script>

const VIEW_ONLY=true;
const DBKEY='fuyu-monogatari-v1-view';
/* 只讀分享版：可讀取同一雲端資料與圖片，但永遠不寫回，也不影響編輯版 */
const FB_BASE='https://fuyu-monogatari-2026-default-rtdb.firebaseio.com';
const FB_URL=FB_BASE+'/store.json';
const FB_BLOB=id=>FB_BASE+'/store/blobs/'+encodeURIComponent(id)+'.json';
const listeners={};
let STORE={},pushTimer=null,pullBusy=false,pushBusy=false,lastRemote='',syncStatus='',skipPullUntil=0,saveGen=0,booted=false;
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(DBKEY));return x&&typeof x==='object'?x:{}}catch(e){return {}}}
function saveLocal(){try{localStorage.setItem(DBKEY,JSON.stringify(STORE));return true}catch(e){
 try{const slim=JSON.parse(JSON.stringify(STORE));if(slim.blobs){Object.keys(slim.blobs).forEach(k=>{if(String(slim.blobs[k]).length>8000)delete slim.blobs[k]});if(!Object.keys(slim.blobs).length)delete slim.blobs}
  localStorage.setItem(DBKEY,JSON.stringify(slim));return true}catch(e2){return false}}}
function storeStamp(s){return (s&&s.meta&&s.meta.updatedAt)||''}
function storeReady(s){return !!(s&&typeof s==='object'&&(s.trip||s.days||s.ledger||s.blobs||s.meta))}
function emit(name){const cols=STORE[name]||{};const sn={docs:Object.keys(cols).map(id=>({id,data:()=>cols[id]}))};(listeners[name]||[]).forEach(fn=>{try{fn(sn)}catch(e){}})}
function emitAll(){Object.keys(listeners).forEach(emit);try{if(typeof applyStore==='function'){applyStore();if(typeof renderTrip==='function')renderTrip();if(typeof renderTabs==='function')renderTabs();if(typeof renderView==='function'&&!edit)renderView()}}catch(e){}}
function isEditing(){return !!(edit||(typeof eF!=='undefined'&&eF)||(typeof eW!=='undefined'&&eW)||(typeof eS!=='undefined'&&eS)||(typeof eCat!=='undefined'&&eCat)||(typeof eP!=='undefined'&&eP)||(typeof eC!=='undefined'&&eC))}
function setSync(msg,ok){syncStatus=msg;const el=document.getElementById('sync');if(el){el.textContent=msg;el.className='tx '+(ok===false?'bad':ok?'ok':'')}}
function deviceTag(){return navigator.userAgent.includes('iPhone')?'iPhone':(navigator.userAgent.includes('Android')?'Android':'web')}
function adoptStore(next,raw){STORE=next&&typeof next==='object'?next:{};if(raw!=null)lastRemote=raw;else lastRemote=JSON.stringify(STORE);saveLocal();if(STORE.blobs)Object.keys(STORE.blobs).forEach(id=>{if(!blobMap[id]||String(blobMap[id]).indexOf('blob:')!==0)blobMap[id]=STORE.blobs[id]});emitAll()}
/* prefer 為主，other 只補 prefer 缺少的欄位（避免不完整本機把購物清單洗掉） */
function mergeStore(prefer,other){
 const out=JSON.parse(JSON.stringify(prefer&&typeof prefer==='object'?prefer:{}));
 if(!other||typeof other!=='object')return out;
 Object.keys(other).forEach(k=>{
  if(k==='meta')return;
  if(out[k]==null){out[k]=other[k];return}
  if(k==='trip'||k==='days'||k==='ledger'||k==='blobs'){
   out[k]=out[k]||{};
   Object.keys(other[k]||{}).forEach(sk=>{if(out[k][sk]==null)out[k][sk]=other[k][sk]});
  }
 });
 const a=storeStamp(prefer),b=storeStamp(other);
 out.meta=Object.assign({},other.meta||{},prefer.meta||{},{updatedAt:(a>=b?a:b)||new Date().toISOString()});
 return out;
}
async function remotePull(force){
 if(pullBusy||pushBusy)return;if(!force&&Date.now()<skipPullUntil)return;if(!force&&isEditing())return;
 const gen=saveGen;pullBusy=true;try{
  const r=await fetch(FB_URL+'?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('讀取雲端失敗 '+r.status);
  const raw=await r.text();
  if(gen!==saveGen||pushBusy)return;
  if(raw==='null'){setSync(VIEW_ONLY?'預覽模式 · 僅供瀏覽':'雲端已連線 · 編輯會自動儲存',true);return}
  if(raw===lastRemote){setSync(VIEW_ONLY?'預覽模式 · 僅供瀏覽':'雲端已連線 · 編輯會自動儲存',true);return}
  let remote;try{remote=JSON.parse(raw||'{}')}catch(e){throw new Error('雲端資料格式錯誤')}
  if(!remote||typeof remote!=='object')remote={};
  /* 只讀版永遠以雲端為準，絕不回寫 */
  if(VIEW_ONLY){adoptStore(remote,raw);setSync('預覽模式 · 僅供瀏覽',true);if(booted)refreshAllBlobs().catch(()=>{});return}
  const loc=storeStamp(STORE),rem=storeStamp(remote);
  if(storeReady(STORE)&&loc&&rem&&loc>rem){
   STORE=mergeStore(STORE,remote);saveLocal();
   setSync('本機較新，合併上傳中…',true);await remotePush();return}
  if(storeReady(STORE))adoptStore(mergeStore(remote,STORE),null);
  else adoptStore(remote,raw);
  setSync('已同步 · '+new Date().toLocaleTimeString(),true);
  if(booted)refreshAllBlobs().catch(()=>{});
 }catch(e){if(!storeReady(STORE)){const loc=loadLocal();if(storeReady(loc))adoptStore(loc,null)}setSync('讀取失敗：'+e.message,false)}
 finally{pullBusy=false}}
let pushChain=Promise.resolve();
async function remotePush(opts){
 if(VIEW_ONLY)return false;
 const keepalive=!!(opts&&opts.keepalive);
 if(!storeReady(STORE)){saveLocal();return false}
 if(pushBusy){if(keepalive)return false;await new Promise(r=>{const t=setInterval(()=>{if(!pushBusy){clearInterval(t);r()}},40);setTimeout(()=>{clearInterval(t);r()},10000)});if(pushBusy)return false}
 pushBusy=true;skipPullUntil=Date.now()+8000;
 try{if(!keepalive)setSync('儲存到雲端中…');
  STORE.meta=Object.assign({},STORE.meta||{},{updatedAt:new Date().toISOString(),by:deviceTag()});
  /* 主資料用 PATCH，避免整包 PUT 清掉 store/blobs；大圖改走 store/blobs/{id} */
  const payload=JSON.parse(JSON.stringify(STORE));
  delete payload.blobs;
  const body=JSON.stringify(payload);saveLocal();
  const r=await fetch(FB_URL,{method:'PATCH',headers:{'Content-Type':'application/json'},body,cache:'no-store',keepalive});
  if(!r.ok){const t=await r.text();throw new Error('寫入失敗 '+r.status+' '+(t||'').slice(0,80))}
  skipPullUntil=Date.now()+4000;
  if(!keepalive){try{const chk=await fetch(FB_URL+'?t='+Date.now(),{cache:'no-store'});if(chk.ok){const got=await chk.text();if(got&&got!=='null')lastRemote=got}}catch(e){}
   setSync('已同步到雲端 · '+new Date().toLocaleTimeString(),true)}
  return true;
 }catch(e){setSync('儲存失敗：'+e.message,false);saveLocal();if(!keepalive)throw e;return false}
 finally{pushBusy=false}}
function queuePush(){if(VIEW_ONLY)return;clearTimeout(pushTimer);pushTimer=setTimeout(()=>{flushPush().catch(()=>{})},500)}
function flushPush(){if(VIEW_ONLY)return Promise.resolve(false);clearTimeout(pushTimer);saveGen++;pushChain=pushChain.then(()=>remotePush(),()=>remotePush());return pushChain}
const localDb={collection(name){return {doc(id){return {async set(data){if(VIEW_ONLY)throw new Error('預覽模式不可編輯');STORE[name]=STORE[name]||{};STORE[name][id]=JSON.parse(JSON.stringify(data));saveGen++;saveLocal();emit(name);const ok=await flushPush();if(!ok)throw new Error('雲端儲存失敗')}}},onSnapshot(cb){(listeners[name]=listeners[name]||[]).push(cb);emit(name);return ()=>{}}}}};
const blobMap={};
const CLOUD_OK_KEY='fuyu-blob-cloud-ok-view';
function loadCloudOk(){try{const a=JSON.parse(localStorage.getItem(CLOUD_OK_KEY)||'[]');if(Array.isArray(a))a.forEach(id=>blobCloudOk.add(String(id)))}catch(e){}}
function saveCloudOk(){try{localStorage.setItem(CLOUD_OK_KEY,JSON.stringify([...blobCloudOk]))}catch(e){}}
function markCloudOk(id){if(!id)return;blobCloudOk.add(id);saveCloudOk()}
function blobSrc(id){if(!id)return '';if(blobMap[id])return blobMap[id];if(STORE.blobs&&STORE.blobs[id])return STORE.blobs[id];if(/[\/.]/.test(id)||String(id).startsWith('data:'))return id;return ''}
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('fuyu-blobs',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('blobs'))r.result.createObjectStore('blobs')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(id,blob){const d=await idbOpen();return new Promise((res,rej)=>{const tx=d.transaction('blobs','readwrite');tx.objectStore('blobs').put(blob,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbGet(id){try{const d=await idbOpen();return await new Promise((res,rej)=>{const tx=d.transaction('blobs','readonly');const req=tx.objectStore('blobs').get(id);req.onsuccess=()=>res(req.result||null);req.onerror=()=>rej(req.error)})}catch(e){return null}}
function preferDisplayUrl(id,dataUrl,fileBlob){

const LC=['餐飲','交通','住宿','購物','門票娛樂','其他'],PM=['現金','信用卡','西瓜卡','行動支付','其他'];
const td=new Date().toISOString().slice(0,10);
let LG={budget:0,list:[]},lEdit='',lDate=(td>='2026-11-26'&&td<='2026-12-04')?td:'2026-11-26',lCur='JPY',lMsg='',lUndo=null;
const acBox=document.getElementById('acct');
const toTWD=r=>{if(r.cur==='TWD')return +r.amt;const c=CR.find(x=>x.code===r.cur);return c?+r.amt*(+c.rate):0};
const sym=c=>c==='JPY'?'¥':c==='TWD'?'NT$':c+' ';
function renderAcct(){
 if(!canEdit){acBox.innerHTML='<div class="card tbd">這個分頁只有擁有者能看。</div>';return}
 const L=LG.list,tot=L.reduce((s,r)=>s+toTWD(r),0),jp=L.filter(r=>r.cur==='JPY').reduce((s,r)=>s+(+r.amt),0),b=+LG.budget||0;
 const miss=L.some(r=>r.cur!=='TWD'&&!CR.find(x=>x.code===r.cur));
 const bycat=LC.map(c=>[c,L.filter(r=>r.cat===c).reduce((s,r)=>s+toTWD(r),0)]).filter(x=>x[1]>0);
 const days=[...new Set(L.map(r=>r.date))].sort().reverse();
 const e=L.find(r=>r.id===lEdit)||{date:lDate,cat:LC[0],item:'',amt:'',cur:lCur,pay:PM[0],note:''};
 const curs=['TWD',...CR.map(x=>x.code).filter(c=>c!=='TWD')];if(!curs.includes(e.cur))curs.push(e.cur);
 const opt=(arr,v)=>arr.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
 acBox.innerHTML=`<div class="card"><div class="acs"><div><small>總支出（約）</small><b>NT$ ${nf(tot,0)}</b></div><div><small>日圓合計</small><b>¥ ${nf(jp,0)}</b></div><div><small>${b?'剩餘預算':'預算'}</small><b>${b?'NT$ '+nf(b-tot,0):'未設定'}</b></div></div>${b?`<div class="pb"><i style="width:${Math.min(100,tot/b*100)}%"></i></div>`:''}<label style="margin-top:12px">總預算（台幣）<input id="ab" type="number" inputmode="decimal" value="${b||''}" placeholder="例如 80000"></label>${miss?'<div class="nt" style="color:var(--mute);font-size:13px">⚠ 有幣別尚未設定匯率，該筆未計入總額（請到「幣值換算」設定）</div>':''}${bycat.length?`<div class="chips" style="margin-top:10px">${bycat.map(([c,v])=>`<span>${c} NT$ ${nf(v,0)}${tot?' · '+Math.round(v/tot*100)+'%':''}</span>`).join('')}</div>`:''}</div>
 <div class="card" style="margin-top:14px"><div class="banner">${lEdit?'修改這筆帳':'新增一筆帳'}</div><div class="row"><label class="sm">日期<input id="ad" type="date" value="${esc(e.date)}"></label><label class="sm">類別<select id="ac">${opt(LC,e.cat)}</select></label><label>項目<input id="ai" value="${esc(e.item)}" placeholder="例如：拉麵、JR 車票"></label></div><div class="row"><label class="sm">金額<input id="aa" type="number" inputmode="decimal" value="${esc(e.amt)}"></label><label class="sm">幣別<select id="ak">${opt(curs,e.cur)}</select></label><label class="sm">付款方式<select id="ap">${opt(PM,e.pay)}</select></label><label>備註<input id="an" value="${esc(e.note)}"></label></div><button class="btn pri" data-a="addrec">${lEdit?'更新':'＋ 新增'}</button>${lEdit?'<button class="btn" data-a="cancelrec">取消修改</button>':''}${lUndo?'<button class="btn" data-a="undorec">↶ 復原剛才刪除</button>':''}<span id="amsg" style="font-size:13px;color:var(--mute)">${esc(lMsg)}</span></div>
 ${days.length?days.map(d=>{const R=L.filter(r=>r.date===d);return `<div class="dh"><span>${esc(d.slice(5).replace('-','/'))}</span><span>NT$ ${nf(R.reduce((s,r)=>s+toTWD(r),0),0)}</span></div><div class="card" style="padding:4px 18px">${R.map(r=>`<div class="rec"><div class="l"><span class="cat">${esc(r.cat)}</span>${esc(r.item)||'（未命名）'}<div class="sm2">${esc(r.pay)}${r.note?' · '+esc(r.note):''}</div><button class="btn s" data-a="editrec" data-id="${esc(r.id)}">✎</button><button class="btn s del" data-a="delrec" data-id="${esc(r.id)}">刪除</button></div><div class="amt">${sym(r.cur)}${nf(r.amt,2)}${r.cur!=='TWD'&&toTWD(r)?`<small>≈ NT$ ${nf(toTWD(r),0)}</small>`:''}</div></div>`).join('')}</div>`}).join(''):'<div class="card tbd" style="margin-top:14px">還沒有任何帳款紀錄</div>'}`}
async function saveLG(){try{await db.collection('ledger').doc('main').set({budget:LG.budget,list:LG.list});return true}catch(err){lMsg='儲存失敗，請確認有編輯權限';return false}}
acBox.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id,g=i=>document.getElementById(i);lMsg='';
 if(a==='addrec'){const o={id:lEdit||Date.now().toString(36),date:g('ad').value,cat:g('ac').value,item:g('ai').value.trim(),amt:Number(g('aa').value),cur:g('ak').value,pay:g('ap').value,note:g('an').value.trim()};
  if(!o.date||!(o.amt>0)){lMsg='請填寫日期與金額';return renderAcct()}
  const prev=cl(LG.list);const k=LG.list.findIndex(r=>r.id===lEdit);if(lEdit&&k>=0)LG.list[k]=o;else LG.list.push(o);
  lDate=o.date;lCur=o.cur;lEdit='';if(!await saveLG())LG.list=prev;return renderAcct()}
 if(a==='cancelrec'){lEdit='';return renderAcct()}
 if(a==='editrec'){lEdit=id;renderAcct();try{g('ad').scrollIntoView({block:'center'})}catch(x){}return}
 if(a==='delrec'){const prev=cl(LG.list);LG.list=LG.list.filter(r=>r.id!==id);if(await saveLG()){lUndo=prev;setTimeout(()=>{lUndo=null;renderAcct()},8000)}else LG.list=prev;return renderAcct()}
 if(a==='undorec'&&lUndo){const cur=LG.list;LG.list=lUndo;lUndo=null;if(!await saveLG())LG.list=cur;return renderAcct()}});
acBox.addEventListener('change',async e=>{if(e.target.id==='ab'){const old=LG.budget;LG.budget=Number(e.target.value)||0;if(!await saveLG())LG.budget=old;renderAcct()}});
function watchLedger(){db.collection('ledger').onSnapshot(sn=>{sn.docs.forEach(doc=>{if(doc.id==='main'){const v=doc.data()||{};LG={budget:v.budget||0,list:cl(v.list||[])}}});renderAcct()},()=>{})}
const SECS=[['home','首頁'],['s-flights','航班'],['s-stay','宿泊情報'],['s-days','每日行程'],['s-wish','旅行の予定'],['s-shop','購物清單'],['s-pack','行李收納清單'],['s-cur','幣值換算'],['s-ootd','每日穿搭 OOTD'],['s-jnl','旅途手記'],['s-acct','記帳']];
const dr=document.getElementById('drawer'),mb=document.getElementById('mb'),goHome=document.getElementById('goHome');
let curSec='home';function buildMenu(){dr.querySelector('.dl').innerHTML=SECS.filter(([id])=>id!=='s-acct'||canEdit).map(([id,t])=>`<button data-s="${id}" class="${id===curSec?'act':''}">${SNOW_ICO}<span>${t}</span></button>`).join('')}buildMenu();
function validSec(id){return SECS.some(([s])=>s===id&&(s!=='s-acct'||canEdit))}
function openSec(id,jump){
 if(!validSec(id))id='home';
 curSec=id;
 document.querySelectorAll('.sec').forEach(x=>x.classList.toggle('on',(id==='home'&&!x.classList.contains('noh'))||x.id===id));
 dr.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('act',b.dataset.s===id));
 if(goHome)goHome.classList.toggle('show',id!=='home');
 try{sessionStorage.setItem('fuyu-sec',id)}catch(e){}
 try{const h=id==='home'?'':('#'+id);if(location.hash!==h)history.replaceState(null,'',h||(location.pathname+location.search))}catch(e){}
 try{if(typeof STAY!=='undefined'&&STAY.render)STAY.render()}catch(e){}
 if(jump){try{document.querySelector('main').scrollIntoView()}catch(e){}}
}
function tgl(o){dr.classList.toggle('open',o);mb.setAttribute('aria-expanded',o)}
mb.onclick=()=>tgl(!dr.classList.contains('open'));
if(goHome)goHome.onclick=()=>{tgl(false);openSec('home',true);try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){window.scrollTo(0,0)}};
dr.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b){openSec(b.dataset.s,true);tgl(false)}else if(e.target.classList.contains('ov'))tgl(false)});
addEventListener('keydown',e=>{if(e.key==='Escape')tgl(false)});
addEventListener('hashchange',()=>{const id=(location.hash||'').replace(/^#/,'')||'home';if(validSec(id))openSec(id,false)});
(()=>{let id=(location.hash||'').replace(/^#/,'');if(!id){try{id=sessionStorage.getItem('fuyu-sec')||''}catch(e){id=''}}openSec(validSec(id)?id:'home',false)})();
box.addEventListener('change',async e=>{const t=e.target;if(!t.dataset.up||!edit||!t.files[0])return;const i=+t.closest('.item').dataset.i,m=document.getElementById('msg');m.textContent='圖片上傳中…';
 try{const as=await claude.use('assets');if(!as)throw 0;const r=await as.upload(await shrink(t.files[0]));draft.items[i].img=r.id;renderEdit()}catch(err){m.textContent='圖片上傳失敗，請確認有編輯權限'}});
const lb=document.createElement('div');lb.id='lb';lb.innerHTML='<img alt="">';document.body.appendChild(lb);
lb.onclick=()=>lb.classList.remove('on');
document.addEventListener('click',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.src&&t.classList&&(t.classList.contains('ti')||t.classList.contains('zoom'))){lb.firstChild.src=t.src;lb.classList.add('on')}});

function keepImgs(k,items){const base=(BASE[k]&&BASE[k].items)||[];return (items||[]).map(it=>{const fixed={...it,n:spotNameFix(String(it.n||'').trim())};if(fixed.img||Object.prototype.hasOwnProperty.call(it,'img'))return fixed;const hit=base.find(b=>b.img&&spotNameFix(String(b.n).trim())===fixed.n);return hit?{...fixed,img:hit.img}:fixed})}
function applyStore(){const daysS=STORE.days||{};Object.keys(daysS).forEach(id=>{const k=+id.slice(1),v=daysS[id];if(DAYS[k]&&v)DAYS[k]={...DAYS[k],title:v.title,c:v.c,items:keepImgs(k,v.items)}});const t=STORE.trip||{};if(t.flights&&t.flights.list!=null)FL=asList(t.flights.list).map(normFl);if(t.wishes){const n=normWish(t.wishes);WCATS=cl(n.regions);WSPOTS=cl(n.spots);WL=cl(n.list)}if(t.shopping){if(t.shopping.list!=null)SH=cl(asList(t.shopping.list)).map(normShopItem);if(Array.isArray(t.shopping.cats)&&t.shopping.cats.length)CATS=t.shopping.cats.map(String)}if(t.packing&&t.packing.groups)PK=cl(t.packing.groups);if(t.currency&&t.currency.list!=null)CR=cl(asList(t.currency.list));if(t.stays&&t.stays.list!=null)STAY.set(asList(t.stays.list));if(t.ootd&&t.ootd.list!=null)OOTD.set(asList(t.ootd.list));if(t.journal&&t.journal.list!=null)JNL.set(asList(t.journal.list));const led=STORE.ledger&&STORE.ledger.main;if(led)LG={budget:led.budget||0,list:cl(asList(led.list||[]))}}
/* 必須放在 FL/SH/STAY 等宣告之後，否則 applyStore 會丟錯並跳過雲端同步（購物清單最容易因此重整後消失） */
(async()=>{try{
 /* 先從 IndexedDB 還原圖片，再畫畫面，避免先空白再慢慢跳出 */
 await hydrateBlobs();
 if(storeReady(STORE)){applyStore();paintBlobs()}
 await remotePull(true);booted=true;
 const [u,d]=await Promise.all([claude.use('user'),claude.use('db')]);
 db=d;canEdit=!VIEW_ONLY;if(d)watchTrip();if(d&&canEdit)watchLedger();applyStore();paintBlobs();
 setSync(VIEW_ONLY?'預覽模式 · 僅供瀏覽':'雲端已連線 · 編輯會自動儲存',true);
 if(d){d.collection('days').onSnapshot(sn=>{sn.docs.forEach(doc=>{const k=+doc.id.slice(1),v=doc.data();
  if(DAYS[k]&&v&&!(edit&&k===cur))DAYS[k]={...DAYS[k],title:v.title,c:v.c,items:keepImgs(k,v.items)}});
  const spotCh=refreshSpotImgs();
  renderTabs();if(!edit)renderView();if(spotCh)renderWish()},()=>{})}
 await refreshAllBlobs();
 }catch(e){booted=true;try{await hydrateBlobs();await remotePull(true);applyStore();paintBlobs();await refreshAllBlobs()}catch(e2){setSync('啟動同步失敗',false)}}})();

/* ===== 迷你點唱機（左上固定，不自動播放）===== */
(()=>{
 const TRACKS=[
  {title:'Winter (The Wind Can Be Still)',sub:'星露谷物語',
   src:'https://archive.org/download/stardew_valley_ost/Stardew%20Valley/28%20Winter%20(The%20Wind%20Can%20Be%20Still).mp3'},
  {title:"Grandpa's Theme",sub:'星露谷物語',
   src:"https://archive.org/download/stardew_valley_ost/Stardew%20Valley/03%20Grandpa%27s%20Theme.mp3"},
  {title:'花之舞 (Piano Ver.)',sub:'DJ Okawari · 鋼琴純享',
   src:'audio/flower-dance-piano.mp3',
   alts:[
    'https://hanna921202.github.io/fuyu-monogatari-2026/audio/flower-dance-piano.mp3'
   ]},
  {title:'First Love (Piano Ver.)',sub:'宇多田光',
   src:'https://archive.org/download/First_Love_piano_version/FirstLovepianoversion.mp3',
   alts:[
    'https://archive.org/download/utada-hikaru-first-love/Utada%20Hikaru%20-%20First%20Love.mp3'
   ]}
 ];
 const audio=document.getElementById('jb-audio');
 const titleEl=document.getElementById('jb-title');
 const subEl=document.getElementById('jb-sub');
 const playBtn=document.getElementById('jb-play');
 const nextBtn=document.getElementById('jb-next');
 if(!audio||!playBtn)return;
 let idx=0, altI=0;
 function show(){
  const t=TRACKS[idx];
  titleEl.textContent=t.title;
  subEl.textContent=t.sub;
  playBtn.textContent=audio.paused?'▶':'❚❚';
  playBtn.classList.toggle('on',!audio.paused);
 }
 function load(i,autoplay){
  idx=(i+TRACKS.length)%TRACKS.length;
  altI=0;
  const t=TRACKS[idx];
  audio.src=t.src;
  audio.load();
  show();
  if(autoplay){
   audio.addEventListener('canplay',()=>{audio.play().catch(()=>{})},{once:true});
  }
  audio.onerror=()=>{
   const alts=t.alts||[];
   if(altI<alts.length){
    audio.src=alts[altI++];
    audio.load();
    return;
   }
   subEl.textContent='無法載入音訊';
  };
 }
 playBtn.addEventListener('click',async()=>{
  if(!audio.getAttribute('src')&&!audio.src)load(idx,false);
  try{
   if(audio.paused){
    await audio.play();
    playBtn.textContent='❚❚';
    playBtn.classList.add('on');
    subEl.textContent=TRACKS[idx].sub;
   }else{
    audio.pause();
    playBtn.textContent='▶';
    playBtn.classList.remove('on');
   }
  }catch(e){subEl.textContent='請再點一次播放'}
 });
 nextBtn.addEventListener('click',()=>{const was=!audio.paused;load(idx+1,was)});
 audio.addEventListener('ended',()=>load(idx+1,true));
 audio.addEventListener('play',()=>{playBtn.textContent='❚❚';playBtn.classList.add('on')});
 audio.addEventListener('pause',()=>{if(!audio.ended){playBtn.textContent='▶';playBtn.classList.remove('on')}});
 load(0,false);
})();
</script>
